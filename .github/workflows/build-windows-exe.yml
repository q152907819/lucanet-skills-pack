name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "windows/claude-cli/exe/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build win-x64 single-file EXE
        shell: pwsh
        run: |
          ./windows/claude-cli/exe/build-exe-windows.ps1 -Runtime win-x64

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe = "windows/claude-cli/exe/dist/win-x64/LucanetAgentPackInstaller.exe"
          $hash = Get-FileHash -Algorithm SHA256 $exe
          "$($hash.Hash)  LucanetAgentPackInstaller.exe" | Set-Content -Encoding ASCII "windows/claude-cli/exe/dist/win-x64/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LucanetAgentPackInstaller-win-x64
          path: |
            windows/claude-cli/exe/dist/win-x64/LucanetAgentPackInstaller.exe
            windows/claude-cli/exe/dist/win-x64/SHA256SUMS.txt
