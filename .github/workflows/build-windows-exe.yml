name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "windows/claude-cli/exe/**"
      - "windows/claude-cli/install-claude-cli-windows.ps1"
      - "windows/claude-cli/doctor-claude-cli-windows.ps1"
      - "windows/claude-cli/manifest/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Claude CLI offline payload
        shell: pwsh
        run: |
          $base = "https://downloads.claude.ai/claude-code-releases"
          $version = (Invoke-RestMethod "$base/latest").Trim()
          $payloadDir = "windows/claude-cli/payload"
          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
          Invoke-RestMethod "$base/$version/manifest.json" | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 "$payloadDir/manifest.json"
          $manifest = Get-Content -Raw "$payloadDir/manifest.json" | ConvertFrom-Json
          $checksum = $manifest.platforms."win32-x64".checksum
          Invoke-WebRequest "$base/$version/win32-x64/claude.exe" -OutFile "$payloadDir/claude-win32-x64.exe"
          $actual = (Get-FileHash -Algorithm SHA256 "$payloadDir/claude-win32-x64.exe").Hash.ToLower()
          if ($actual -ne $checksum.ToLower()) {
            throw "Claude payload checksum mismatch. Expected $checksum, got $actual"
          }
          $checksum | Set-Content -Encoding ASCII "$payloadDir/claude-win32-x64.sha256"
          $version | Set-Content -Encoding ASCII "$payloadDir/version.txt"

      - name: Build win-x64 single-file EXE
        shell: pwsh
        run: |
          ./windows/claude-cli/exe/build-exe-windows.ps1 -Runtime win-x64

      - name: Smoke test EXE dry-run
        shell: pwsh
        run: |
          $exe = "windows/claude-cli/exe/dist/win-x64/LucanetAgentPackInstaller.exe"
          & $exe --no-api-key --dry-run --skip-doctor
          if ($LASTEXITCODE -ne 0) {
            throw "Installer smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe = "windows/claude-cli/exe/dist/win-x64/LucanetAgentPackInstaller.exe"
          $hash = Get-FileHash -Algorithm SHA256 $exe
          "$($hash.Hash)  LucanetAgentPackInstaller.exe" | Set-Content -Encoding ASCII "windows/claude-cli/exe/dist/win-x64/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LucanetAgentPackInstaller-win-x64
          path: |
            windows/claude-cli/exe/dist/win-x64/LucanetAgentPackInstaller.exe
            windows/claude-cli/exe/dist/win-x64/SHA256SUMS.txt
